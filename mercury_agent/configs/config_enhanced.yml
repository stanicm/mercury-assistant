# Enhanced Mercury Agent Configuration with NAT v1.3+ Features
# This configuration adds profiling, observability, and evaluation capabilities

# General system configuration
general:
  use_uvloop: true  # Enable uvloop for improved async performance

# ============================================================================
# TELEMETRY & OBSERVABILITY CONFIGURATION (NEW)
# ============================================================================
telemetry:
  _type: opentelemetry
  enabled: true
  service_name: mercury_agent
  export_console: true  # Print metrics to console
  # Optional: Export to observability platform
  # export_phoenix: true
  # phoenix_endpoint: "http://localhost:6006"
  # export_weave: true
  # weave_project: "mercury-agent"

# ============================================================================
# PROFILING CONFIGURATION (NEW)
# ============================================================================
profiler:
  enabled: true
  track_tokens: true      # Track input/output tokens
  track_latency: true     # Track execution time
  track_cost: true        # Track estimated costs
  print_summary: true     # Print summary after each run

# ============================================================================
# FUNCTION CONFIGURATIONS
# ============================================================================
functions:
  # RAG (Retrieval Augmented Generation) tool configuration
  nvbp_rag:
    _type: nvbp_rag
    base_url: "http://0.0.0.0:8081/v1"  # RAG server endpoint
    collection_name: "SPH"              # Knowledge base collection name
    top_k: 3                           # Number of top results to retrieve
    timeout: 120                       # Request timeout in seconds
    use_knowledge_base: true           # Enable knowledge base retrieval
    # NEW: Profiling settings
    profile: true
    tags: ["rag", "retrieval", "sph"]

  # Direct Wikipedia search tool configuration
  wikipedia_search:
    _type: langchain_researcher_tool
    llm_name: nim_llm  # Use local Nemotron Nano 9B
    # NEW: Profiling settings
    profile: true
    tags: ["research", "wikipedia", "external"]

  # Haystack chitchat agent configuration
  haystack_chitchat_agent:
    _type: haystack_chitchat_agent
    # Local Nemotron Nano 9B NIM
    llm_name: nvidia/nvidia-nemotron-nano-9b-v2
    model_name: nvidia/nvidia-nemotron-nano-9b-v2
    base_url: "http://localhost:8000/v1"
    timeout: 90                        # Request timeout in seconds
    # NEW: Profiling settings
    profile: true
    tags: ["chitchat", "general", "haystack"]

# ============================================================================
# LANGUAGE MODEL CONFIGURATIONS
# ============================================================================
llms:
  # Primary LLM for general tasks
  nim_llm:
    _type: nim
    # Local Nemotron Nano 9B NIM
    model_name: nvidia/nvidia-nemotron-nano-9b-v2
    base_url: "http://localhost:8000/v1"
    temperature: 0.0                   # Lower temperature for more focused responses
    max_tokens: 1024                    # Maximum response length
    timeout: 180                       # Request timeout in seconds
    # NEW: Cost tracking (estimated)
    cost_per_token: 0.0  # Set to actual cost if known
    # NEW: Profiling
    profile: true
    tags: ["primary", "local", "nemotron"]

  # LLM for chitchat with higher temperature for more creative responses
  chitchat_llm:
    _type: nim
    # Local Nemotron Nano 9B NIM
    model_name: nvidia/nvidia-nemotron-nano-9b-v2
    base_url: "http://localhost:8000/v1"
    temperature: 0.7                   # Higher temperature for more creative responses
    max_tokens: 1024                    # Maximum response length
    timeout: 180                       # Request timeout in seconds
    profile: true
    tags: ["chitchat", "local", "creative"]

  # Cloud LLM for research summarization (LangChain compatibility)
  cloud_research_llm:
    _type: nim
    model_name: nvdev/meta/llama-3.3-70b-instruct
    base_url: "https://integrate.api.nvidia.com/v1"
    temperature: 0.3                   # Lower temperature for factual summarization
    max_tokens: 2048                    # Longer for summaries
    timeout: 180                       # Request timeout in seconds
    profile: true
    tags: ["cloud", "research", "llama"]

# ============================================================================
# EMBEDDING MODEL CONFIGURATION
# ============================================================================
embedders:
  nim_embedder:
    _type: nim
    model_name: nvdev/nvidia/nv-embedqa-e5-v5  # Model for text embeddings
    truncate: END                      # Truncation strategy
    timeout: 180                       # Request timeout in seconds
    profile: true
    tags: ["embeddings", "rag"]

# ============================================================================
# EVALUATION CONFIGURATION (NEW)
# ============================================================================
evaluation:
  enabled: false  # Set to true when you want to run evaluations
  # RAG Evaluation Settings
  rag_eval:
    metrics:
      - answer_relevancy
      - faithfulness
      - context_precision
      - context_recall
    test_set: "./data/eval/rag_test_set.json"
    output_dir: "./data/eval/results"
  
  # Agent Evaluation Settings
  agent_eval:
    metrics:
      - task_success_rate
      - response_quality
      - tool_selection_accuracy
    test_set: "./data/eval/agent_test_set.json"
    output_dir: "./data/eval/results"

# ============================================================================
# MAIN WORKFLOW CONFIGURATION
# ============================================================================
workflow:
  _type: aiq_mercury_agent/mercury_agent  # Workflow type
  llm: nim_llm                            # Local Nemotron Nano 9B for all tasks
  data_dir: ./mercury/README.md           # Data directory for RAG
  rag_tool: nvbp_rag                      # RAG tool to use
  research_tool: wikipedia_search         # Research tool to use
  chitchat_agent: haystack_chitchat_agent # Chitchat agent to use
  # NEW: Workflow-level profiling
  profile: true
  tags: ["mercury", "main", "multi-agent"]
  # NEW: Retry configuration
  max_retries: 2
  retry_delay: 1.0

